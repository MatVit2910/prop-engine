[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prop-engine"
version = "0.1.0"
description = "Live NBA Player Props Pricing Engine & +EV Betting Bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncio",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.31.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
